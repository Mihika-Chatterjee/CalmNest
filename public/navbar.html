    <script>
        async function updateNavbar(){
  const res = await fetch('/check-session');
  const data = await res.json();
  const authItem = document.querySelector('.login-btn');
  if(!authItem) return;
  if(data.loggedIn){
    authItem.outerHTML = `<span>Hi, ${data.user.username}</span> <button id="logoutBtn">Logout</button>`;
    document.getElementById('logoutBtn').addEventListener('click', async ()=>{
      await fetch('/logout',{method:'POST'});
      location.reload();
    });
  }
}
updateNavbar();

    </script>
