<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Journal Entries</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #d1c4e9, #b39ddb);
      padding: 40px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #4a148c;
    }
    .entry {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin: 15px auto;
      max-width: 700px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .date {
      font-size: 14px;
      color: #6a1b9a;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>📖 My Journal Entries</h1>
  <div id="entries"></div>

  <script>
    async function loadEntries() {
      const response = await fetch("/get_journal");
      const data = await response.json();

      const entriesDiv = document.getElementById("entries");
      if (data.success && data.entries.length > 0) {
        entriesDiv.innerHTML = data.entries.map(entry => `
          <div class="entry">
            <div class="date">${new Date(entry.created_at).toLocaleString()}</div>
            <div>${entry.entry}</div>
          </div>
        `).join("");
      } else {
        entriesDiv.innerHTML = "<p>No entries found yet.</p>";
      }
    }

    loadEntries();
  </script>
</body>
</html>
