<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Community Poems</title>
<style>
  body {
    background: linear-gradient(135deg, #ede7f6, #d1c4e9);
    font-family: 'Poppins', sans-serif;
    color: #4a148c;
  }
  .container {
    max-width: 800px;
    margin: 50px auto;
    background: #fff;
    border-radius: 10px;
    padding: 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  }
  .poem {
    border-bottom: 1px solid #ccc;
    padding: 15px 0;
  }
  .poem:last-child { border: none; }
  h2 { color: #6a1b9a; }
</style>
</head>
<body>
<div id="navbar"></div>
<div class="container">
  <h1>Community Poems</h1>
  <div id="poemList">Loading poems...</div>
</div>
<div id="footer"></div>
<script>
async function loadPoems() {
  const container = document.getElementById('poemList');
  try {
    const res = await fetch('/poems');
    const data = await res.json();
    if(!data.success) {
      container.textContent = data.error || 'Error loading poems';
      return;
    }

    if(data.poems.length === 0) {
      container.textContent = 'No poems yet!';
      return;
    }

    // Clear container
    container.innerHTML = '';

    // Display poems
    data.poems.forEach(p => {
      const div = document.createElement('div');
      div.style.border = '1px solid #ccc';
      div.style.padding = '10px';
      div.style.marginBottom = '10px';
      div.style.borderRadius = '8px';
      div.innerHTML = `<h3>${p.title}</h3><p>${p.content}</p><small>By: ${p.username} | ${new Date(p.created_at).toLocaleString()}</small>`;
      container.appendChild(div);
    });

  } catch(err) {
    container.textContent = 'Error fetching poems!';
    console.error(err);
  }
}

loadPoems();
</script>
</body>
</html>
